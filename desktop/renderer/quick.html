<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Zapisz w Loopa</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { background: var(--panel); }
    body { user-select: none; }
    .q { display: flex; flex-direction: column; height: 100vh; padding: 14px 16px 14px; border: 1px solid #2c2c2c; border-radius: 12px; }
    .q-head { display: flex; align-items: center; gap: 8px; -webkit-app-region: drag; }
    .q-head img { width: 22px; height: 22px; border-radius: 6px; }
    .q-head b { flex: 1; font-size: 15px; }
    .q-head button { -webkit-app-region: no-drag; width: 28px; height: 28px; border-radius: 8px; font-size: 18px; color: var(--muted); }
    .q-head button:hover { background: #222; color: #fff; }
    .q-item { display: flex; gap: 10px; align-items: center; margin: 12px 0 8px; min-height: 64px; }
    .q-thumb { width: 48px; height: 64px; border-radius: 6px; background: #222 center/cover; flex: none; }
    .q-meta { min-width: 0; }
    .q-title { font-size: 13px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .q-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .q-list { flex: 1; overflow-y: auto; margin: 0 -6px; }
    .q-list .check { padding: 6px; font-size: 14px; }
    .q-foot { display: flex; gap: 8px; margin-top: 8px; }
    .q-foot .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="q">
    <div class="q-head"><img src="icon.png" alt=""><b>Zapisz w Loopa</b><button id="close" title="Pomiń">×</button></div>
    <div class="q-item"><div class="q-thumb" id="thumb"></div><div class="q-meta"><div class="q-title" id="title">Wczytuję…</div><div class="q-sub" id="sub"></div></div></div>
    <div class="q-list" id="list"></div>
    <div class="q-foot"><button class="btn" id="skip">Pomiń</button><button class="btn primary" id="save" disabled>Zapisz</button></div>
  </div>
  <script type="module" src="quick.js"></script>
</body>
</html>
