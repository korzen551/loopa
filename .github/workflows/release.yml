name: Release APK

# Wydanie powstaje po wypchnieciu taga (np. v1.3) albo recznie z zakladki Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Klucz debugowy musi byc ten sam co w zainstalowanej apce, inaczej Android
      # odmowi aktualizacji "po wierzchu" i trzeba by odinstalowac stara wersje,
      # tracac playlisty. Dlatego keystore jedzie z sekretu repozytorium.
      - name: Odtworz keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Brak sekretu DEBUG_KEYSTORE_B64 - aktualizacja po wierzchu by nie przeszla."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

          # Dowod w logach, ze plik jest ten, ktory mial byc - zeby cicha
          # niezgodnosc podpisu (i skasowane playlisty przy update) nigdy wiecej
          # nie przeszla niezauwazona.
          echo "Odcisk klucza w tym buildzie:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -keypass android 2>&1 | grep SHA256

      - name: Zbuduj APK
        run: gradle assembleRelease --no-daemon

      - name: Zbierz dane wersji
        id: meta
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mv app/build/outputs/apk/release/app-release.apk "Loopa-$NAME.apk"
          cat > latest.json <<EOF
          {
            "versionCode": $CODE,
            "versionName": "$NAME",
            "url": "https://github.com/${{ github.repository }}/releases/latest/download/Loopa-$NAME.apk"
          }
          EOF
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.name) }}
          name: Loopa ${{ steps.meta.outputs.name }}
          files: |
            Loopa-${{ steps.meta.outputs.name }}.apk
            latest.json
