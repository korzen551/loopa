name: Sprawdz kompilacje

# Szybka kontrola przy kazdym wypchnieciu: czy kod sie w ogole kompiluje.
#
# Celowo NIE budujemy tu gotowego pakietu. Gotowy pakiet musi byc podpisany
# tym samym kluczem co zainstalowana apka, a klucz siedzi w sekrecie uzywanym
# tylko przez przeplyw wydania. Probowanie tego tutaj konczylo sie czerwonym
# krzyzykiem przy kazdym commicie - albo, co gorsza przed poprawka, po cichu
# produkowalo plik z losowym kluczem, ktorego nie dalo sie zainstalowac
# "po wierzchu". Wydania robi release.yml, uruchamiany tagiem.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kompilacja
        run: gradle compileReleaseKotlin --no-daemon
